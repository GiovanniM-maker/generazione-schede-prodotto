# Configurazione Supabase CLI per "generazione-schede-prodotto"
# Documentazione: https://supabase.com/docs/guides/cli/config
project_id = "generazione-schede-prodotto"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# I seed, dichiarati e in ordine.
#
# Erano tre file, e solo il primo veniva applicato da solo: gli altri due si
# ricordavano a mano, o non si ricordavano. È il motivo per cui un database
# locale appena creato non aveva né i settori né gli attributi di sistema — e
# quindi la suite del browser non ci poteva girare sopra.
#
# L'ordine conta: `seed.sql` porta i preset di sistema e il listino,
# `seed_config.sql` i settori, `seed_config_food_pharma.sql` le categorie e gli
# attributi di food e pharma (compreso il settore `…0f01-…001` su cui si
# appoggiano i dati seminati dai test).
[db.seeds]
enabled = true
sql_paths = ["./seed.sql", "./seed_config.sql", "./seed_config_food_pharma.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
